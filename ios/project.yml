name: WoolyWalking
options:
  bundleIdPrefix: dev.woolston
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/App.xcconfig
  Release: Config/App.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: NO
targets:
  WoolyWalking:
    type: application
    platform: iOS
    sources:
      - WoolyWalking
    info:
      path: WoolyWalking/Info.plist
      properties:
        CFBundleDisplayName: Wooly Walking
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSHealthShareUsageDescription: Wooly Walking reads your step count so it can fill in your weekly total for you. It never writes to Health or shares your health data.
        UILaunchScreen:
          UIColorName: Background
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: WoolyWalking/WoolyWalking.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  WoolyWalkingTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - WoolyWalkingTests
    dependencies:
      - target: WoolyWalking
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.woolston.steps.tests
schemes:
  WoolyWalking:
    build:
      targets:
        WoolyWalking: all
    test:
      targets:
        - WoolyWalkingTests
